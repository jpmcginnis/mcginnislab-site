<title>McGinnis Lab</title>

<meta name="theme-color" content="#000000">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    width: 100%;
    background: #000000;
    font-family: 'Red Hat Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
    color: #ffffff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }
  .stage {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    gap: clamp(3rem, 8vh, 6rem);
  }
  .lockup {
    display: flex;
    align-items: center;
    gap: clamp(1rem, 2.5vw, 2rem);
    opacity: 0;
    animation: fadeIn 1.2s ease-out forwards;
  }
  .lockup svg {
    width: clamp(110px, 16vw, 210px);
    height: auto;
    flex-shrink: 0;
    display: block;
  }
  .titles h1 {
    font-family: 'Red Hat Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
    font-size: clamp(2.2rem, 5.5vw, 4rem);
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.05;
    margin-bottom: 0.15em;
    color: #ffffff;
    white-space: nowrap;
  }
  .titles p {
    font-size: clamp(1.35rem, 2.1vw, 2rem);
    font-weight: 400;
    letter-spacing: 0.04em;
    color: #a6a6a6;
    line-height: 1.2;
    white-space: nowrap;
  }
  .opening {
    font-size: clamp(0.9rem, 1.4vw, 1.35rem);
    font-weight: 400;
    letter-spacing: 0.04em;
    color: #ffffff;
    text-align: center;
    opacity: 0;
    animation: fadeIn 1.2s ease-out 0.4s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .lockup, .opening, .data-link { animation: none; opacity: 1; }
  }
  .nav {
    position: fixed;
    bottom: 1.5rem;
    right: 1.75rem;
    display: flex;
    gap: 1.5rem;
    opacity: 0;
    animation: fadeIn 1.2s ease-out 0.8s forwards;
  }
  .nav a {
    font-family: 'Red Hat Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
    font-size: clamp(0.95rem, 1.5vw, 1.3rem);
    font-weight: 400;
    letter-spacing: 0.04em;
    color: #ffffff;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }
  .nav a:hover { opacity: 0.7; }
  /* Narrow screens: stack logo above titles */
  @media (max-width: 560px) {
    .lockup { flex-direction: column; text-align: center; gap: 1.25rem; }
    .titles h1, .titles p { white-space: normal; }
    .nav { bottom: 1rem; right: 1rem; gap: 1rem; }
  }
</style>
</head>
